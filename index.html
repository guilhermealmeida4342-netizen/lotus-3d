<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Glowing Lotus - Three.js</title>
<style>
body {
margin: 0;
overflow: hidden;
background-color: #000;
display: flex;
justify-content: center;
align-items: center;
}
canvas {
display: block;
}
</style>
<!-- Chamando a biblioteca Three.js 3D -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<script>
// 1. Configurando a cena e a câmera
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 2, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// 2. Iluminação mágica (Luzes Ambiente e Pontual)
const ambientLight = new THREE.AmbientLight(0xffb6c1, 0.8);
scene.add(ambientLight);

const centerLight = new THREE.PointLight(0xff69b4, 3, 20);
centerLight.position.set(0, 1, 0);
scene.add(centerLight);

// 3. Material de pétalas cristalinas brilhantes (Vidro/Material de Brilho)
const petalMaterial = new THREE.MeshPhysicalMaterial({
color: 0xffc0cb,
emissive: 0xff69b4,
emissiveIntensity: 0.4,
roughness: 0.08,
transmission: 0.7, // Transparência de vidro
thickness: 1.5,
clearcoat: 1.0,
clearcoatRoughness: 0.05,
side: THREE.DoubleSide,
transparent: true,
opacity: 0.9
});

// 4. Construindo a forma da pétala (Geometria de Pétala)
function createPetalShape() {
const shape = new THREE.Shape();
shape.moveTo(0, 0);
shape.bezierCurveTo(0.6, 1, 0.8, 2.5, 0, 4);
shape.bezierCurveTo(-0.8, 2.5, -0.6, 1, 0, 0);

const extrudeSettings = { depth: 0.06, bevelEnabled: true, bevelSegments: 3, steps: 2, bevelSize: 0.025 };
return new THREE.ExtrudeGeometry(shape, extrudeSettings);
}

const petalGeometry = createPetalShape();
const flowerGroup = new THREE.Group();

// 5. Criando camadas de pétalas e distribuindo para formar a flor
const petals = [];
const layers = [
{ count: 6, scale: 0.4, angleOffset: 1.8, delay: 0.0, zPos: 0.8 },
{ count: 8, scale: 0.55, angleOffset: 1.9, delay: 0.15, zPos: 0.5 },
{ count: 10, scale: 0.7, angleOffset: 2.0, delay: 0.3, zPos: 0.2 },
{ count: 12, scale: 0.85, angleOffset: 2.1, delay: 0.45, zPos: -0.1 },
{ count: 14, scale: 1.0, angleOffset: 2.2, delay: 0.6, zPos: -0.4 },
];

layers.forEach((layer) => {
for (let i = 0; i < layer.count; i++) {
const petalMesh = new THREE.Mesh(petalGeometry, petalMaterial);
const angle = (i / layer.count) * Math.PI * 2;

const pivotGroup = new THREE.Group();
petalMesh.scale.set(layer.scale, layer.scale, layer.scale);
petalMesh.position.y = layer.zPos;

// Posicionar pétalas corretamente
pivotGroup.rotation.y = angle;
petalMesh.rotation.x = 0.2;
petalMesh.position.z = 0.5;

pivotGroup.add(petalMesh);
flowerGroup.add(pivotGroup);

// Armazenando as pétalas para animá-las depois
petals.push({ 
  mesh: petalMesh, 
  pivotGroup: pivotGroup,
  maxRotation: layer.angleOffset,
  delay: layer.delay
});
}
});

scene.add(flowerGroup);

// 6. Centro brilhante da flor (Núcleo de Brilho)
const coreGeo = new THREE.SphereGeometry(0.5, 32, 32);
const coreMat = new THREE.MeshBasicMaterial({ color: 0xffff99 });
const core = new THREE.Mesh(coreGeo, coreMat);
core.position.y = 0;
scene.add(core);

// Adicionar mais brilho ao núcleo
const coreGlow = new THREE.SphereGeometry(0.65, 32, 32);
const coreGlowMat = new THREE.MeshBasicMaterial({ 
  color: 0xffff99,
  opacity: 0.3,
  transparent: true
});
const coreGlowMesh = new THREE.Mesh(coreGlow, coreGlowMat);
coreGlowMesh.position.y = 0;
scene.add(coreGlowMesh);

// 7. Animação de abertura e rotação (Loop de Animação)
let progress = 0;

function animate() {
requestAnimationFrame(animate);

// Girar a flor inteira lentamente
flowerGroup.rotation.y += 0.003;
flowerGroup.rotation.x += 0.0005;

// Pulsar suave do núcleo
const pulse = Math.sin(Date.now() * 0.002) * 0.15 + 1;
core.scale.set(pulse, pulse, pulse);
coreGlowMesh.scale.set(pulse * 1.3, pulse * 1.3, pulse * 1.3);

// Movimento de abertura gradual das pétalas
if (progress < 1) {
progress += 0.003;

// Efeito easing suave
const easeProgress = progress < 0.5 
  ? 2 * progress * progress 
  : -1 + (4 - 2 * progress) * progress;

petals.forEach(item => {
// Delay escalonado para cada pétala
const delayedProgress = Math.max(0, easeProgress - item.delay);
const clampedProgress = Math.min(1, delayedProgress / (1 - item.delay));

// Rotação simples e funcional
item.mesh.rotation.x = 0.2 + (clampedProgress * item.maxRotation);
});
}

renderer.render(scene, camera);
}

animate();

// Redimensionar quando o tamanho da tela mudar
window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
