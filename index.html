<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Glowing Lotus - Three.js</title>
<style>
body {
margin: 0;
overflow: hidden;
background: linear-gradient(135deg, #1a0033 0%, #330066 50%, #1a0033 100%);
display: flex;
justify-content: center;
align-items: center;
}
canvas {
display: block;
}
#message {
position: fixed;
top: 80px;
left: 50%;
transform: translateX(-50%);
font-size: 32px;
color: #c85ce0;
text-shadow: 0 0 20px #9933ff, 0 0 40px #c85ce0, 0 0 60px #9933ff;
font-family: 'Arial', sans-serif;
font-weight: bold;
opacity: 0;
transition: opacity 2s ease-in;
pointer-events: none;
letter-spacing: 2px;
}
#message.show {
opacity: 1;
}
</style>
<!-- Chamando a biblioteca Three.js 3D -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<script>
// 1. Configurando a cena e a câmera
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 7.5, 8.5);
camera.lookAt(0, 0.8, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// 2. Iluminação mágica (Luzes Ambiente e Pontual)
const ambientLight = new THREE.AmbientLight(0xe0c5f0, 1.2);
scene.add(ambientLight);

const centerLight = new THREE.PointLight(0x9933ff, 5, 30);
centerLight.position.set(0, 1.5, 0);
scene.add(centerLight);

// Luz adicional para melhorar as pétalas
const sideLight = new THREE.PointLight(0xc85ce0, 3, 25);
sideLight.position.set(4, 3, 4);
scene.add(sideLight);

// Luz traseira para criar profundidade
const backLight = new THREE.PointLight(0xbb66ff, 2, 20);
backLight.position.set(-4, 1, -5);
scene.add(backLight);

// 3. Material de pétalas cristalinas brilhantes (mais intenso e profundo)
const petalMaterial = new THREE.MeshPhysicalMaterial({
color: 0x8f1dff,
emissive: 0x6d00d9,
emissiveIntensity: 0.85,
roughness: 0.02,
transmission: 0.95,
thickness: 4.2,
clearcoat: 1.0,
clearcoatRoughness: 0.0,
iridescence: 0.7,
iridescenceIOR: 1.2,
side: THREE.DoubleSide,
transparent: true,
opacity: 1
});

// 4. Construindo a forma da pétala (Geometria de Pétala) - MAIS PROFUNDA
function createPetalShape() {
const shape = new THREE.Shape();

// Base da pétala - mais larga
shape.moveTo(0, 0);

// Lado direito - curvado e realista
shape.bezierCurveTo(0.5, 0.3, 0.8, 1.2, 0.9, 2.0);
shape.bezierCurveTo(0.95, 2.8, 0.7, 3.5, 0.3, 4.0);
shape.bezierCurveTo(0.1, 4.3, 0.02, 4.5, 0, 4.6); // Ponta

// Lado esquerdo - simetria
shape.bezierCurveTo(-0.02, 4.5, -0.1, 4.3, -0.3, 4.0);
shape.bezierCurveTo(-0.7, 3.5, -0.95, 2.8, -0.9, 2.0);
shape.bezierCurveTo(-0.8, 1.2, -0.5, 0.3, 0, 0);

const extrudeSettings = { 
  depth: 0.2,  // Muito mais profundo!
  bevelEnabled: true, 
  bevelSegments: 6, 
  steps: 4,  // Mais segmentos = mais realista
  bevelSize: 0.05 
};
return new THREE.ExtrudeGeometry(shape, extrudeSettings);
}

const petalGeometry = createPetalShape();
const flowerGroup = new THREE.Group();

// 5. Criando camadas de pétalas e distribuindo para formar a flor
const petals = [];
const layers = [
{ count: 8, scale: 0.45, angleOffset: 1.8, delay: 0.0, zPos: 0.9 },
{ count: 10, scale: 0.6, angleOffset: 1.9, delay: 0.12, zPos: 0.6 },
{ count: 12, scale: 0.75, angleOffset: 2.0, delay: 0.24, zPos: 0.3 },
{ count: 14, scale: 0.9, angleOffset: 2.1, delay: 0.36, zPos: 0.0 },
{ count: 16, scale: 1.0, angleOffset: 2.2, delay: 0.48, zPos: -0.3 },
];

layers.forEach((layer) => {
for (let i = 0; i < layer.count; i++) {
const petalMesh = new THREE.Mesh(petalGeometry, petalMaterial);
const angle = (i / layer.count) * Math.PI * 2;

const pivotGroup = new THREE.Group();
petalMesh.scale.set(layer.scale, layer.scale, layer.scale);
petalMesh.position.y = layer.zPos;

// Posicionar pétalas - aproveitando profundidade
pivotGroup.rotation.y = angle;
petalMesh.rotation.x = 0.12;
petalMesh.position.z = 0.35;

pivotGroup.add(petalMesh);
flowerGroup.add(pivotGroup);

// Armazenando as pétalas para animá-las depois
petals.push({ 
  mesh: petalMesh, 
  pivotGroup: pivotGroup,
  maxRotation: layer.angleOffset,
  delay: layer.delay
});
}
});

scene.add(flowerGroup);

// 6. Centro brilhante da flor (Núcleo de Brilho)
const coreGeo = new THREE.SphereGeometry(0.6, 32, 32);
const coreMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
const core = new THREE.Mesh(coreGeo, coreMat);
core.position.y = 0;
scene.add(core);

// Adicionar mais brilho ao núcleo - halo brilhante
const coreGlow = new THREE.SphereGeometry(0.85, 32, 32);
const coreGlowMat = new THREE.MeshBasicMaterial({ 
  color: 0xffdd00,
  opacity: 0.4,
  transparent: true
});
const coreGlowMesh = new THREE.Mesh(coreGlow, coreGlowMat);
coreGlowMesh.position.y = 0;
scene.add(coreGlowMesh);

// Núcleo interno mais brilhante
const coreInner = new THREE.SphereGeometry(0.3, 32, 32);
const coreInnerMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const coreInnerMesh = new THREE.Mesh(coreInner, coreInnerMat);
coreInnerMesh.position.y = 0;
scene.add(coreInnerMesh);

// ===== PAPEL DE BUQUÊ =====
// Removendo o branco pesado; apenas um suporte bem discreto e quase invisível
const wrapperMaterial = new THREE.MeshStandardMaterial({
  color: 0x2f1b3d,
  roughness: 0.95,
  metalness: 0.0,
  transparent: true,
  opacity: 0.08
});

const wrapperBaseGeo = new THREE.CylinderGeometry(1.5, 2.1, 1.8, 24, 1, true);
const wrapperBase = new THREE.Mesh(wrapperBaseGeo, wrapperMaterial);
wrapperBase.position.y = -1.4;
scene.add(wrapperBase);

const wrapperInnerGeo = new THREE.ConeGeometry(1.3, 1.2, 20);
const wrapperInner = new THREE.Mesh(wrapperInnerGeo, wrapperMaterial);
wrapperInner.position.y = -0.5;
scene.add(wrapperInner);

// Pequenos detalhes muito sutis para manter o charme sem competir com a lotus
const tinyHeartGeometry = new THREE.TorusKnotGeometry(0.08, 0.02, 40, 8, 2, 3);
const tinyHeartMaterial = new THREE.MeshStandardMaterial({
  color: 0xeea5c7,
  roughness: 0.9,
  metalness: 0.0,
  transparent: true,
  opacity: 0.25
});

const tinyHeart = new THREE.Mesh(tinyHeartGeometry, tinyHeartMaterial);
tinyHeart.position.set(0.8, -1.0, 0.5);
tinyHeart.rotation.set(1.2, 0.4, 0.8);
scene.add(tinyHeart);

const tinyHeart2 = tinyHeart.clone();
tinyHeart2.position.set(-0.8, -1.15, 0.6);
tinyHeart2.rotation.set(1.0, -0.4, -0.7);
scene.add(tinyHeart2);

// Flor dominante na composição
flowerGroup.scale.set(1.35, 1.35, 1.35);

// 7. Animação de abertura e rotação (Loop de Animação)
let progress = 0;
let messageShown = false;

function easeInOutCubic(t) {
  return t < 0.5
    ? 4 * t * t * t
    : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function animate() {
  requestAnimationFrame(animate);

  if (progress < 1) {
    progress += 0.0035;
  }

  const easedProgress = easeInOutCubic(Math.min(1, progress));

  petals.forEach((item) => {
    const delayedProgress = Math.max(0, easedProgress - item.delay);
    const clampedProgress = Math.min(1, delayedProgress / Math.max(0.1, 1 - item.delay));

    item.mesh.rotation.x = 0.18 + clampedProgress * (item.maxRotation - 0.18);
    item.mesh.rotation.z = Math.sin(progress * 8 + item.delay * 20) * 0.04;
  });

  // Depois que abre, a flor gira suavemente sem "fechar" ou parecer estranha
  flowerGroup.rotation.y += progress >= 1 ? 0.0032 : 0.0018;
  flowerGroup.rotation.x = 0.0;

  // Pulsar suave do núcleo
  const pulse = Math.sin(Date.now() * 0.002) * 0.18 + 1;
  core.scale.set(pulse, pulse, pulse);
  coreGlowMesh.scale.set(pulse * 1.4, pulse * 1.4, pulse * 1.4);
  coreInnerMesh.scale.set(pulse * 0.8, pulse * 0.8, pulse * 0.8);

  renderer.render(scene, camera);
}

animate();

// Redimensionar quando o tamanho da tela mudar
window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
